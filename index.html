<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomov</title>
    <meta name="description" content="Tomov portfolio and prototype gallery.">
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
            color: var(--text);
            padding: 32px 20px;
        }

        .card {
            width: min(760px, 100%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 18px 38px rgba(15, 23, 42, 0.08);
            padding: clamp(28px, 5vw, 56px);
            text-align: center;
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 14px;
            padding: 6px 12px;
            border-radius: 999px;
            background: #dbeafe;
            color: var(--primary-dark);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 18px;
            font-size: clamp(2.3rem, 6vw, 4rem);
            line-height: 1.05;
            letter-spacing: -0.04em;
        }

        p {
            margin: 0 auto 28px;
            max-width: 600px;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .button {
            display: inline-block;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .button:hover {
            transform: translateY(-1px);
        }

        .button.primary {
            background: var(--primary);
            color: #fff;
        }

        .button.primary:hover {
            background: var(--primary-dark);
        }

        .button.secondary {
            background: #eef2ff;
            color: var(--primary-dark);
            border: 1px solid #dfe7ff;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="eyebrow">Portfolio</div>
        <h1>Tomov</h1>
        <p>Design prototypes, concept explorations, and interactive previews for product thinking and interface work.</p>
        <div class="actions">
            <a class="button primary" href="prototypes.html">Open Prototypes</a>
            <a class="button secondary" href="https://github.com/siux-tomov/tomov.github.io" target="_blank" rel="noreferrer">GitHub Repo</a>
        </div>
    </main>
</body>
</html>
