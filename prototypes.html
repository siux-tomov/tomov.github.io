<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototypes - Tomov</title>
    <meta name="description" content="Interactive Figma prototype gallery for Tomov projects.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%232563eb' width='100' height='100'/><text x='50' y='65' font-size='70' font-weight='bold' fill='white' text-anchor='middle'>T</text></svg>">
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --border: #e5e7eb;
            --shadow: rgba(15, 23, 42, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --card: #1e293b;
                --text: #f1f5f9;
                --muted: #cbd5e1;
                --border: #334155;
                --shadow: rgba(0, 0, 0, 0.4);
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 48px 20px;
            transition: background 0.3s ease;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            }
        }

        .container {
            width: min(980px, 100%);
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.2rem, 4vw, 3rem);
            letter-spacing: -0.04em;
        }

        .nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 12px 18px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .button:hover {
            transform: translateY(-1px);
        }

        .button.secondary {
            background: #eef2ff;
            color: var(--primary-dark);
            border: 1px solid #dfe7ff;
        }

        @media (prefers-color-scheme: dark) {
            .button.secondary {
                background: rgba(37, 99, 235, 0.1);
                color: #93c5fd;
                border: 1px solid rgba(37, 99, 235, 0.3);
            }
        }

        .prototype-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 18px 38px var(--shadow);
            padding: 32px;
            margin-bottom: 28px;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .prototype-header {
            margin-bottom: 20px;
        }

        .prototype-section h2 {
            margin: 0 0 8px;
            font-size: clamp(1.5rem, 2vw, 2rem);
        }

        .prototype-description {
            color: var(--muted);
            font-size: 0.95rem;
            margin: 0;
        }

        .prototype-container {
            display: flex;
            justify-content: center;
            overflow: hidden;
            border-radius: 12px;
            background: #f9fafb;
            border: 1px solid var(--border);
        }

        @media (prefers-color-scheme: dark) {
            .prototype-container {
                background: #0f172a;
            }
        }

        iframe {
            width: min(100%, 800px);
            height: 450px;
            border: 0;
            display: block;
            background: white;
        }

        @media (prefers-color-scheme: dark) {
            iframe {
                background: #1e293b;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Design Prototypes</h1>
            <div class="nav">
                <a class="button secondary" href="./">← Home</a>
            </div>
        </div>

        <section id="bluviu" class="prototype-section">
            <div class="prototype-header">
                <h2>BluViu</h2>
                <p class="prototype-description">Interactive prototype for the BluViu platform experience.</p>
            </div>
            <div class="prototype-container">
                <iframe src="https://embed.figma.com/proto/BqIRtLSdfzBK1tjIksoYeN/BluViu?page-id=0%3A1&node-id=20-24&starting-point-node-id=20%3A24&show-proto-sidebar=1&embed-host=share" allowfullscreen title="BluViu prototype"></iframe>
            </div>
        </section>

        <section id="dsk" class="prototype-section">
            <div class="prototype-header">
                <h2>DSK</h2>
                <p class="prototype-description">Design system kit and component exploration.</p>
            </div>
            <div class="prototype-container">
                <iframe src="https://embed.figma.com/proto/XihMwe7l0rW9m0IV7LMEaE/DSK?page-id=0%3A1&node-id=1-484&starting-point-node-id=1%3A484&scaling=min-zoom&content-scaling=fixed&show-proto-sidebar=1&embed-host=share" allowfullscreen title="DSK prototype"></iframe>
            </div>
        </section>
    </div>
</body>
</html>
