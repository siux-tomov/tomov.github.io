<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototypes - Tomov</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #333;
        }
        
        .prototype-section {
            background: white;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .prototype-section h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 24px;
        }
        
        .prototype-container {
            display: flex;
            justify-content: center;
        }
        
        iframe {
            border-radius: 4px;
        }
        
        .nav {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .nav a {
            display: inline-block;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin: 0 10px;
            transition: background 0.3s;
        }
        
        .nav a:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Design Prototypes</h1>
        
        <div class="nav">
            <a href="/">← Back to Home</a>
        </div>
        
        <div class="prototype-section">
            <h2>BluViu</h2>
            <div class="prototype-container">
                <iframe style="border: 1px solid rgba(0, 0, 0, 0.1);" width="800" height="450" src="https://embed.figma.com/proto/BqIRtLSdfzBK1tjIksoYeN/BluViu?page-id=0%3A1&node-id=20-24&starting-point-node-id=20%3A24&show-proto-sidebar=1&embed-host=share" allowfullscreen></iframe>
            </div>
        </div>
        
        <div class="prototype-section">
            <h2>DSK</h2>
            <div class="prototype-container">
                <iframe style="border: 1px solid rgba(0, 0, 0, 0.1);" width="800" height="450" src="https://embed.figma.com/proto/XihMwe7l0rW9m0IV7LMEaE/DSK?page-id=0%3A1&node-id=1-484&starting-point-node-id=1%3A484&scaling=min-zoom&content-scaling=fixed&show-proto-sidebar=1&embed-host=share" allowfullscreen></iframe>
            </div>
        </div>
    </div>
</body>
</html>
